```html
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Qazan</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:white;
background:linear-gradient(135deg,#090d1b,#242c52,#111426);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:420px;
padding:30px;
border:1px solid #ffffff25;
border-radius:25px;
background:#ffffff0d;
box-shadow:0 20px 70px #0006;
text-align:center;
}

.phone{
font-size:100px;
margin-bottom:15px;
filter:drop-shadow(0 10px 20px #8495ff55);
}

h1{font-size:30px;margin-bottom:12px}
p{color:#c4c9dd;line-height:1.6;margin-bottom:22px}

input{
width:100%;
padding:15px;
margin:8px 0;
border:1px solid #444d70;
border-radius:10px;
background:#101528;
color:white;
font-size:15px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#a3b5ff,#d9b4ff);
color:#11152b;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{opacity:.88}

#result{display:none}

</style>
</head>

<body>

<div class="card" id="registration">
    <div class="phone">📱</div>

    <h1>iPhone qazan!</h1>

    <p>İştirak etmək üçün qeydiyyatdan keç.</p>

    <form id="form">
        <input type="text" placeholder="Adınız" required>
        <input type="email" placeholder="E-poçt ünvanınız" required>

        <button type="submit">QEYDİYYATDAN KEÇ</button>
    </form>
</div>

<div class="card" id="result" style="display:none">
    <div class="phone">🔒</div>
    <h1>Məlumatlarınız ələ keçirildi!</h1>
    <p>
        Bu, fişinq hücumunu nümayiş etdirən simulyasiyadır.
        Heç bir məlumat serverə göndərilməyib və saxlanılmayıb.
    </p>
</div>

<script>
document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();

    document.getElementById("registration").style.display="none";
    document.getElementById("result").style.display="block";

    history.pushState({}, "", "?demo-result");
});
</script>

</body>
</html>
```
