```html
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iPhone Hədiyyəsi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101010, #303030);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            color: #222;
            padding: 35px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.15);
        }

        .phone {
            font-size: 85px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #111;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #444;
            transform: scale(1.02);
        }

        .small {
            font-size: 12px;
            color: #777;
            margin-top: 18px;
        }

        #warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #e00000;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }

        #warning h2 {
            font-size: clamp(38px, 9vw, 70px);
            margin-bottom: 20px;
        }

        #warning p {
            font-size: 20px;
            line-height: 1.5;
        }

        #warning button {
            max-width: 240px;
            margin-top: 25px;
            background: white;
            color: #c00;
        }
    </style>
</head>

<body>

    <main class="card" id="registration">

        <div class="phone">📱</div>

        <h1>iPhone qazanın!</h1>

        <p class="description">
            Hədiyyə kampaniyasında iştirak etmək üçün
            qeydiyyat formasını doldurun.
        </p>

        <form id="form">

            <input
                type="text"
                id="name"
                placeholder="Adınız"
                autocomplete="off"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-poçt ünvanınız"
                autocomplete="off"
                required
            >

            <button type="submit">
                QEYDİYYATDAN KEÇ
            </button>

        </form>

        <p class="small">
            Təhlükəsizlik nümayişi üçün hazırlanmış demo.
            Real hədiyyə vədi deyil.
        </p>

    </main>

    <section id="warning">
        <h2>HACKLƏNDİNİZ!</h2>

        <p>
            Bu, təhlükəsizlik nümayişidir.<br>
            Şübhəli saytlara şəxsi məlumatlarınızı daxil etməyin.
        </p>

        <button onclick="location.reload()">
            BAŞA DÜŞDÜM
        </button>
    </section>

    <script>
        const form = document.getElementById("form");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("registration").style.display = "none";
            document.getElementById("warning").style.display = "flex";
        });
    </script>

</body>
</html>
```
